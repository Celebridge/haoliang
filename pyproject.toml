[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haoliang"
version = "0.1.0"
description = "A local-first reader model for one mind."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Celebridge" }]
keywords = ["ai", "memory", "rag", "graph", "mcp", "personal"]
dependencies = ["numpy>=1.24", "jieba>=0.42"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
local = ["sentence-transformers>=2.2"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.scripts]
haoliang = "haoliang.cli:main"
haoliang-mcp = "haoliang.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/haoliang"]

[tool.hatch.build.targets.wheel.force-include]
"config/reader.json" = "haoliang/_default_reader.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
